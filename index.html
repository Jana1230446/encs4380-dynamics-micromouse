<!DOCTYPE html>
<html lang="en">

<head>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dynamic Characteristics Toolkit</title>
</head>

    
<body>

    <h1>Dynamic Characteristics Toolkit</h1>

    <h2>Module 1: First-Order Time Response</h2>

    <p>
        Explore how gain (K) and time constant (τ)
        affect the response of a first-order system.
    </p>

    <h3>System Model</h3>

    <p>τ dy/dt + y = Kx</p>

    <h3>Controls</h3>

    <label for="gain">Gain (K):</label>
    <span> id="gainValue">1.0</span>
    <input type="range" id="gain" min="0.5" max="5"
           step="0.1" value="1">

    <br><br>

    <label for="tau">Time Constant (τ):</label>
    <span> id="tauValue">1.0</span> s
    <input type="range" id="tau" min="0.1" max="10"
           step="0.1" value="1">

    <br><br>

    <label for="inputType">Input Type:</label>

    <select id="inputType">
        <option value="step">Step Input</option>
        <option value="ramp">Ramp Input</option>
    </select>

    <h3>System Response</h3>

    <div id="responseGraph" style="width:100%; max-width:900px; height:450px;"></div>
    
<script>
    //get the sliders and input selector 
    const gainSlider = document.getElementById("gain");
    const tauSlider = document.getElementById("tau");
    const inputSelector = document.getElementById("inputType");

    function updateGraph(){
        const k = parseFloat(gainSlider.value);
        const tau = parseFloat(tauSlider.value);
        const inputType = inputSelector.value;

        document.getElementById("gainValue").textContent = k.toFixed(1);
        document.getElementById("tauValue").textContent = tau.toFixed(1);

        let time = [];
        let output = [];
        let input = [];


        for (let i=0 ; i<= 200 ; i++){
            let t = i * (30 / 200);
            let y ; 
            let x ; 
            if (inputType === "step"){
                x = 1;
                // first order step response 
                y= k* (1 - Math.exp(-t / tau));
                
            }else {
                x = t ; 
                //first order ramp response
                y = k*( t - tau * (1 - Math.exp(-t / tau))); 
            }
            time.push(t);
            input.push(x);
            output.push(y);
        }
    
        const inputTrace = {
        x: time,
        y: input,
        mode: "lines",
        name: "Input x(t)",
        line: { color: "blue", dash: "dash" }
        };
    
       const outputTrace = {
        x: time,
        y: output,
        mode: "lines",
        name: "Output y(t)",
        line: { color: "red", width: 3 }
        };
        const layout = {
            title: "First-Order System Response",
            xaxis: { title: "Time (seconds)" },
            yaxis: { title: "Amplitude" },
            legend: { orientation: "h" },
            margin: { t: 60, b: 60 }
        };
        Plotly.react(
            "responseGraph",
            [inputTrace, outputTrace],
            layout,
            { responsive: true }
        );
        
    }
    //update graph whenever a slider changes
    gainSlider.addEventListener("input", updateGraph);
    tauSlider.addEventListener("input", updateGraph);
    inputSelector.addEventListener("change" , updateGraph);

    // draw the first graph when the page loads
    updateGraph();

</script>
</body>
</html>
