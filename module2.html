<!DOCTYPE html>
<html lang="en">

<head>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dynamic Characteristics Toolkit - Module 2</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0; 
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            color: #243047;
        }
        
        .container {
            max-width: 1250px;
            margin: 0 auto;
            padding: 35px 25px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }
    
        .header h1 {
            color: #17365d;
            font-size: 36px;
            margin-bottom: 12px;
        }
    
        .header h2 {
            color: #3478c0;
            font-size: 24px;
        }
    
        .header p {
            color: #64748b;
            font-size: 16px;
        }
    
        .dashboard {
            display: grid;
            grid-template-columns: 300px minmax(0, 1fr);
            gap: 25px;
            align-items: start;
        }
    
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }
    
        .card h3 {
            margin-top: 0 ;
            color:  #17365d;
        }
    
        .control-group {
             margin-bottom: 25px;
        }
    
        .control-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 12px;
        }
    
        input[type="range"] {
            width: 100%;
            accent-color: #3478c0;
            cursor: pointer;
        }
    
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            font-size: 15px;
        }
    
        .model-card {
            margin-bottom: 25px;
            text-align: center;
        }
    
        .model-card p {
            font-size: 20px;
        }
    
        #responseGraph {
            width: 100%;
            height: 450px;
        }
    
        @media (max-width: 850px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 20px 12px;
            }
            .header h1 {
                font-size: 27px;
            }
            .card {
                padding: 18px;
            }
        }

        .extra-card {
            margin-top: 25px;
        }

        .extra-card p {
            line-height: 1.6;
        }

        .prediction-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 16px;
        }

        .prediction-grid label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .prediction-grid input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        .action-button {
            margin-top: 16px;
            background: #3478c0;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            cursor: pointer;
            font-size: 15px;
        }

        .action-button:hover {
            background: #235d99;
        }

        .feedback {
            margin-top: 16px;
            padding: 14px;
            background: #eef5ff;
            border-radius: 8px;
            line-height: 1.7;
        }

        .feedback[hidden] {
            display: none;
        }

        .error-message {
            color: #b42318;
            font-weight: bold;
        }

        .success-message {
            color: #18794e;
            font-weight: bold;
        }

        #errorGraph {
            width: 100%;
            height: 400px;
        }



        .back-button {
            display: inline-block;
            background-color: #3478c0;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        
        .back-button:hover {
            background-color: #235d99;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Back to Home -->
    <a href="index.html" class="back-button">
        ← Back to Home
    </a>

    <!-- Page header -->
    <div class="header">

        <h1>Dynamic Characteristics Toolkit</h1>

        <h2>Module 2: First-Order Frequency Response</h2>

        <p>
            Explore how time constant (τ) and input frequency (ω)
            affect the amplitude and phase of a first-order system.
        </p>

    </div>

    <!-- System model -->
    <div class="card model-card">

        <h3>System Model</h3>

        <p>G(s) = 1 / (τs + 1)</p>

    </div>

    <!-- Main dashboard -->
    <div class="dashboard">

        <!-- Controls card -->
        <div class="card">

            <h3>Controls</h3>

            <div class="control-group">

                <label for="tau">
                    Time Constant (τ):
                    <span id="tauValue">1.0</span> s
                </label>

                <input
                    type="range"
                    id="tau"
                    min="0.1"
                    max="10"
                    step="0.1"
                    value="1"
                >

            </div>

            <div class="control-group">

                <label for="frequency">
                    Input Frequency (ω):
                    <span id="frequencyValue">1.0</span> rad/s
                </label>

                <input
                    type="range"
                    id="frequency"
                    min="0.1"
                    max="20"
                    step="0.1"
                    value="1"
                >

            </div>

        </div>

        <!-- Graph card -->
        <div class="card">

            <h3>Input and Output Sine Waves</h3>

            <div id="responseGraph"></div>

        </div>

    </div>

</div>

    <script>

        // Get HTML elements
        const tauSlider = document.getElementById("tau");
        const frequencySlider = document.getElementById("frequency");

        const tauValue = document.getElementById("tauValue");
        const frequencyValue = document.getElementById("frequencyValue");


        // Update graph whenever a slider changes
        function updateGraph() {

            // Read slider values
            const tau = parseFloat(tauSlider.value);
            const omega = parseFloat(frequencySlider.value);

            // Display current slider values
            tauValue.textContent = tau.toFixed(1);
            frequencyValue.textContent = omega.toFixed(1);


            // Calculate amplitude ratio and phase lag
            const amp = 1 / Math.sqrt(1 + Math.pow(omega * tau, 2));
            const phase = -Math.atan(omega * tau); //negative bc output lags behind the input in phase because a First-Order Low-Pass sys


            // Generate time and signal values
            const time = [];
            const input = [];
            const output = [];

            const periods = 3;
            const totalTime = periods * (2 * Math.PI / omega);
            const points = 300;

            for (let i = 0; i <= points; i++) {

                const t = (i / points) * totalTime;

                const x = Math.sin(omega * t);
                const y = amp * Math.sin(omega * t + phase); 

                time.push(t);
                input.push(x);
                output.push(y);
            }


            // Input sine wave
            const inputTrace = {
                x: time,
                y: input,
                mode: "lines",
                name: "Input x(t)",
                line: {
                    color: "#3478c0",
                    width: 2,
                    dash: "dash"
                }
            };


            // Output sine wave
            const outputTrace = {
                x: time,
                y: output,
                mode: "lines",
                name: "Output y(t)",
                line: {
                    color: "#d94c55",
                    width: 3
                }
            };


            // Graph layout
            const layout = {
                xaxis: { title: "Time (s)" },

                yaxis: { title: "Amplitude", range: [-1.2, 1.2]  },

                legend: { orientation: "h", y: -0.25 },

                margin: { t: 20, b: 85,l: 60, r: 20 }
            };


            // Draw or update graph
            Plotly.react(
                "responseGraph",
                [inputTrace, outputTrace],
                layout,
                { responsive: true }
            );

        }


        // Update graph when sliders move
        tauSlider.addEventListener("input", updateGraph);
        frequencySlider.addEventListener("input", updateGraph);


        // Draw graph when page first loads
        updateGraph();

    </script>

</body>
</html>
